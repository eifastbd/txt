
name: EITV Playlist Auto Update

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update_playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Playlist
        run: |
          test -s try.m3u
          head -n 1 try.m3u | grep -q '#EXTM3U'

      - name: Commit Playlist Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add try.m3u
          if ! git diff --cached --quiet; then
            git commit -m "Playlist auto-updated"
            git push
          else
            echo "No changes to commit."
          fi
